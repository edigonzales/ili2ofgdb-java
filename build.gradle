// ---------------------------------------------------------------------------
// End to end smoke: run the packaged CLI (bindist jar) on a real model/data set,
// inspect the result and export it again.
// ---------------------------------------------------------------------------
def ili2ofgdbSmokeRoot = file("$buildDir/smoke/ili2ofgdb")
def ili2ofgdbSmokeGdb = file("$ili2ofgdbSmokeRoot/abbaustellen.gdb")
def ili2ofgdbSmokeExportXtf = file("$ili2ofgdbSmokeRoot/export.xtf")
def ili2ofgdbSmokeModelDir = file('ili2ofgdb/test/data/smoke/abbaustellen/models')
def ili2ofgdbSmokeDataXtf = file('ili2ofgdb/test/data/smoke/abbaustellen/data/ch.so.afu.abbaustellen.relational.xtf')
def ili2ofgdbSmokeBindistDir = file("$buildDir/smoke/ili2ofgdb-bindist")
def ili2ofgdbSmokeBindistZip = project.hasProperty('bindistZip')
		? file(project.property('bindistZip'))
		: ili2ofgdbBindist.archivePath
def ili2ofgdbSmokeJava = new File(System.properties['java.home'],
		'bin/java' + (System.properties['os.name'].toLowerCase().contains('windows') ? '.exe' : ''))
def ili2ofgdbSmokeJar = new File(ili2ofgdbSmokeBindistDir, 'ili2ofgdb-' + project.version + '.jar')

task ili2ofgdbSmokeBindist(type: Sync) {
	group = 'verification'
	description = 'Smoke: unpacks the packaged ili2ofgdb bindist (jar, libs, docs).'
	if (!project.hasProperty('bindistZip')) {
		dependsOn ili2ofgdbBindist
	}
	from zipTree(ili2ofgdbSmokeBindistZip)
	into ili2ofgdbSmokeBindistDir
}
task ili2ofgdbSmokeSchemaImport(type: Exec) {
	group = 'verification'
	description = 'Smoke: schema import of the abbaustellen model through the packaged ili2ofgdb CLI.'
	dependsOn ili2ofgdbSmokeBindist
	doFirst {
		delete ili2ofgdbSmokeGdb
		ili2ofgdbSmokeRoot.mkdirs()
		workingDir = ili2ofgdbSmokeBindistDir
		executable = ili2ofgdbSmokeJava
		args '-jar', ili2ofgdbSmokeJar.absolutePath,
			'--dbfile', ili2ofgdbSmokeGdb.absolutePath,
			'--defaultSrsCode', '2056',
			'--strokeArcs',
			'--nameByTopic',
			'--modeldir', ili2ofgdbSmokeModelDir.absolutePath,
			'--models', 'SO_AFU_ABBAUSTELLEN_20210630',
			'--log', new File(ili2ofgdbSmokeRoot, 'schemaimport.log').absolutePath,
			'--schemaimport'
	}
}
task ili2ofgdbSmokeImport(type: Exec) {
	group = 'verification'
	description = 'Smoke: data import of the abbaustellen transfer file through the packaged ili2ofgdb CLI.'
	dependsOn ili2ofgdbSmokeSchemaImport
	doFirst {
		workingDir = ili2ofgdbSmokeBindistDir
		executable = ili2ofgdbSmokeJava
		args '-jar', ili2ofgdbSmokeJar.absolutePath,
			'--dbfile', ili2ofgdbSmokeGdb.absolutePath,
			'--defaultSrsCode', '2056',
			'--strokeArcs',
			'--nameByTopic',
			'--modeldir', ili2ofgdbSmokeModelDir.absolutePath,
			'--models', 'SO_AFU_ABBAUSTELLEN_20210630',
			'--log', new File(ili2ofgdbSmokeRoot, 'import.log').absolutePath,
			'--import', ili2ofgdbSmokeDataXtf.absolutePath
	}
}
task ili2ofgdbSmokeExport(type: Exec) {
	group = 'verification'
	description = 'Smoke: export of the smoke database through the packaged ili2ofgdb CLI.'
	dependsOn ili2ofgdbSmokeImport
	doFirst {
		delete ili2ofgdbSmokeExportXtf
		workingDir = ili2ofgdbSmokeBindistDir
		executable = ili2ofgdbSmokeJava
		args '-jar', ili2ofgdbSmokeJar.absolutePath,
			'--dbfile', ili2ofgdbSmokeGdb.absolutePath,
			'--models', 'SO_AFU_ABBAUSTELLEN_20210630',
			'--log', new File(ili2ofgdbSmokeRoot, 'export.log').absolutePath,
			'--export', ili2ofgdbSmokeExportXtf.absolutePath
	}
}
task ili2ofgdbSmokeVerify(type: JavaExec) {
	group = 'verification'
	description = 'Smoke: verifies domains, relationship classes, geometries and the export of the smoke database.'
	dependsOn(ili2ofgdbSmokeExport, 'compileIli2ofgdbTestJava')
	doFirst {
		classpath = configurations.ili2ofgdbRuntimeClasspath + sourceSets.main.output + sourceSets.ili2ofgdb.output + sourceSets.ili2ofgdbTest.output
		main = 'ch.ehi.ili2ofgdb.SmokeInspector'
		args ili2ofgdbSmokeGdb.absolutePath, ili2ofgdbSmokeExportXtf.absolutePath
		if (project.hasProperty('gdalPrefix')) {
			jvmArgs "-Dgdal.prefix=${project.property('gdalPrefix')}"
		}
		if (project.hasProperty('requireGdal')) {
			jvmArgs "-Dofgdb.requireGdal=${project.property('requireGdal')}"
		}
	}
}
task ili2ofgdbSmoke {
	group = 'verification'
	description = 'Runs the complete ili2ofgdb smoke pipeline (packaged bindist, GDAL check if available).'
	dependsOn ili2ofgdbSmokeVerify
}
